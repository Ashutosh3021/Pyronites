[project]
name = "pyronites"
version = "0.1.0"
description = "Official Python client for the Pyronites (PyroCore) backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashutosh" }]
keywords = ["pyronites", "pyrocore", "sqlite", "backend", "client", "supabase"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Ashutosh3021/Pyronites"
Repository = "https://github.com/Ashutosh3021/Pyronites"
Documentation = "https://github.com/Ashutosh3021/Pyronites/tree/main/pyronites/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "build>=1.0",
    "twine>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyronites"]

[tool.hatch.build.targets.sdist]
include = [
    "pyronites/",
    "tests/",
    "examples/",
    "docs/",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

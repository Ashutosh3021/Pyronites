[project]
name = "pyronites"
version = "0.1.0"
description = "Official Python client for the Pyronites (PyroCore) backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashutosh" }]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyronites"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
